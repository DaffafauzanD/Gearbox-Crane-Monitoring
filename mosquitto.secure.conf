# ============================================================
# Konfigurasi Mosquitto - MODE AMAN (login wajib) - BELUM DIPAKAI
# ============================================================
# Aktifkan dengan "mqttAuth": true di service-config.json, SETELAH semua ESP32
# di-update firmware-nya untuk login (lihat README, bagian Login MQTT).
# ESP32 yang belum login akan DITOLAK di mode ini.
#
# Manual, DARI FOLDER PROJECT:
#     "C:\Program Files\mosquitto\mosquitto\mosquitto.exe" -c mosquitto.secure.conf -v

listener 1883

listener 9001
protocol websockets

# Wajib login. User & password dibuat dengan: npm run setup-mqtt
# (hasilnya mqtt/passwd dan mqtt/credentials.json). Hak akses tiap user: mqtt/acl
allow_anonymous false
password_file mqtt/passwd
acl_file mqtt/acl

# Lihat catatan di mosquitto.conf soal log_dest stdout
log_dest file service-logs/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%d %H:%M:%S
