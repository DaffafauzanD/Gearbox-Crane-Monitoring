# ============================================================
# Konfigurasi Mosquitto - MODE TERBUKA (tanpa login) - YANG DIPAKAI SEKARANG
# ============================================================
# Dipakai run-all.js selama "mqttAuth": false di service-config.json, supaya
# ESP32 dengan firmware lama (belum kirim username/password) tetap bisa masuk.
# Versi dengan login wajib: mosquitto.secure.conf (lihat README, bagian Login MQTT).
#
# Manual, DARI FOLDER PROJECT:
#     "C:\Program Files\mosquitto\mosquitto\mosquitto.exe" -c mosquitto.conf -v

# Port MQTT biasa: untuk ESP32, mqtt_logger.js, server.js
listener 1883

# Port WebSocket: untuk dashboard di browser
listener 9001
protocol websockets

allow_anonymous true

# Log broker ditulis ke file. JANGAN pakai "log_dest stdout": Mosquitto versi
# Windows crash (kode 0xC0000409) kalau stdout-nya dialirkan ke program lain,
# seperti yang dilakukan run-all.js.
log_dest file service-logs/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%d %H:%M:%S
